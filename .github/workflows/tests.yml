name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
        beancount: ['>=2.3.4,<3', '>=3,<4']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: python -m pip install -r requirements.txt 'beancount${{ matrix.beancount }}'

      # No pytest: each file is a unittest main() and exits non-zero on failure.
      # Tests inject settings and use isolated SQLite databases; no credentials needed.
      - name: test_refactor
        run: python tests/test_refactor.py

      - name: test_bot
        run: python tests/test_bot.py

      - name: test_fuzz
        run: python tests/test_fuzz.py

      - name: test_runtime
        run: python tests/test_runtime.py

      - name: test_reports
        run: python tests/test_reports.py

      - name: Synthetic ledger performance comparison
        if: matrix.python == '3.12' && matrix.beancount == '>=3,<4'
        run: python scripts/benchmark_ledger.py
